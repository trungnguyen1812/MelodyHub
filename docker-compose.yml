services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: melodyhub
    volumes:
      - ./melodyhub.sql:/docker-entrypoint-initdb.d/melodyhub.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40

  soundalike-service:
    build: ./soundalike-service

  backend:
    build: ./Backend
    env_file: ./Backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: melodyhub
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      FFMPEG_BINARIES: /usr/bin/ffmpeg
      FFPROBE_BINARIES: /usr/bin/ffprobe
      SOUNDALIKE_URL: http://soundalike-service:8002
      LYRIC_ALIGN_URL: http://lyric-service:8001
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      soundalike-service:
        condition: service_started

volumes:
  mysql_data:
